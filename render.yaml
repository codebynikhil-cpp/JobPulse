services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: roleradar-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # Set DATABASE_URL manually in the Render dashboard.
      # For Supabase: postgresql+psycopg://postgres.[PROJECT-REF]:[PASSWORD]@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      # For Render managed Postgres: uncomment the fromDatabase block below and remove the sync: false line.
      - key: DATABASE_URL
        sync: false
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: roleradar-postgres
      #     property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: EMAIL_PROVIDER
        # Set to "resend" and configure RESEND_API_KEY + EMAIL_FROM once you have Resend credentials.
        value: "disabled"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ----------------------------------------------------------------------------
  # Background Worker Service (Monitoring & Notification Outbox)
  # ----------------------------------------------------------------------------
  - type: worker
    name: roleradar-worker
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    plan: starter
    envVars:
      # Same DATABASE_URL as backend — set manually in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: roleradar-postgres
      #     property: connectionString
      - key: EMAIL_PROVIDER
        # Set to "resend" and configure RESEND_API_KEY + EMAIL_FROM once you have Resend credentials.
        value: "disabled"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

# databases:
#   # Uncomment to use Render's managed PostgreSQL instead of an external DB (e.g. Supabase).
#   # Also uncomment the fromDatabase blocks in the services above and remove the sync: false lines.
#   - name: roleradar-postgres
#     plan: starter
#     databaseName: roleradar
#     user: roleradar
#     postgresMajorVersion: 17
