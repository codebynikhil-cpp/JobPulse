services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: roleradar-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roleradar-postgres
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: EMAIL_PROVIDER
        # Set to "resend" and configure RESEND_API_KEY + EMAIL_FROM once you have Resend credentials.
        value: "disabled"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ----------------------------------------------------------------------------
  # Background Worker Service (Monitoring & Notification Outbox)
  # ----------------------------------------------------------------------------
  - type: worker
    name: roleradar-worker
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roleradar-postgres
          property: connectionString
      - key: EMAIL_PROVIDER
        # Set to "resend" and configure RESEND_API_KEY + EMAIL_FROM once you have Resend credentials.
        value: "disabled"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL 17 Database
  # ----------------------------------------------------------------------------
  - name: roleradar-postgres
    plan: starter
    databaseName: roleradar
    user: roleradar
    postgresMajorVersion: 17
