name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: jobpulse
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: jobpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://jobpulse:testpassword123@localhost:5432/jobpulse_test
          APP_ORIGIN: http://localhost:3000
          COOKIE_SECURE: "false"
          EMAIL_PROVIDER: "disabled"
          BROWSER_PROVIDER: "local"
        run: uv run pytest -q

  frontend-check:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stub .env for build
        run: |
          cp .env.example .env
          sed -i 's/replace-with-random-local-password/ci-build-password-12345/g' .env

      - name: Build Docker Compose services
        run: docker compose build

