[project]
name = "jobpulse-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.28,<1",
    "playwright>=1.58,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9", "pre-commit>=4,<5"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
[tool.ruff]
line-length = 100
extend-exclude = ["scripts", "../scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]
